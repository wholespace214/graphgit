name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
          - os: ubuntu-latest
            label: linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Install dependencies
        run: npm ci

      - name: Match package version to the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm pkg set "version=${GITHUB_REF_NAME#v}"

      - name: Typecheck
        run: npm run typecheck

      - name: Smoke test
        run: npm run smoke

      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: graphgit-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/latest*.yml

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: graphgit-*
          merge-multiple: true
          path: installers

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
          fail_on_unmatched_files: true
