appId: com.graphgit.app
productName: GraphGit
executableName: GraphGit
copyright: Copyright © 2026 wholespace214
asar: true
npmRebuild: false
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
  - resources/icon.ico
  - resources/icon.png
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: GraphGit
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
mac:
  icon: resources/icon.png
  identity: null
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
linux:
  icon: resources/icon.png
  category: Development
  maintainer: wholespace214 <wholespace214@users.noreply.github.com>
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
